[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aem"
version = "0.1.0"
description = "Austin Entertainment Monitor - watches Austin venues for new movies, concerts and ticket changes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "selectolax>=0.3",
    "rapidfuzz>=3.9",
    "jinja2>=3.1",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    # exact pin: CI installs this same version, and scripts/check.sh refuses to
    # run if the local venv drifts from it -- so a clean local check means a
    # clean CI run. Bump deliberately, then re-run scripts/check.sh.
    "ruff==0.16.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aem = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# tests construct naive UTC datetimes on purpose: that is how the models store
# them (see the aem.models docstring), so an aware datetime would not match
"tests/*" = ["DTZ001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
