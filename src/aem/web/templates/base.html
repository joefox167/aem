<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AEM{% endblock %} · Austin Entertainment Monitor</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <script src="/static/htmx.min.js" defer></script>
  <style>
    .badge { display:inline-block; padding:.1rem .5rem; border-radius:.75rem;
             font-size:.75rem; font-weight:600; vertical-align:middle; }
    .badge.on_sale { background:#1a7f37; color:#fff; }
    .badge.presale { background:#9a6700; color:#fff; }
    .badge.sold_out { background:#cf222e; color:#fff; }
    .badge.coming_soon { background:#57606a; color:#fff; }
    .badge.unknown { background:#57606a; color:#fff; }
    .badge.added { background:#1a7f37; color:#fff; }
    .badge.removed { background:#cf222e; color:#fff; }
    .badge.updated { background:#0969da; color:#fff; }
    .badge.ticket_status { background:#8250df; color:#fff; }
    .venue-chip { display:inline-block; padding:.05rem .45rem; border:1px solid var(--pico-muted-border-color);
                  border-radius:.75rem; font-size:.7rem; margin-right:.25rem; }
    .muted { color: var(--pico-muted-color); font-size:.85rem; }
    nav strong { font-size:1.1rem; white-space:nowrap; }
    section { margin-bottom: 2.5rem; }
    li.item { margin-bottom:.6rem; list-style:none; }
    ul.plain { padding-left:0; }

    /* compact event rows: date block | title + details | price + tickets */
    h4.section { margin:1.75rem 0 .25rem; font-size:.8rem; text-transform:uppercase;
                 letter-spacing:.08em; color:var(--pico-muted-color); }
    h4.section small { font-weight:400; margin-left:.35rem; }
    ul.rows { padding:0; margin:0; }
    li.row { list-style:none; display:grid; grid-template-columns:3.4rem 1fr auto;
             gap:.2rem 1rem; align-items:center; padding:.55rem 0; position:relative;
             border-bottom:1px solid var(--pico-muted-border-color); }
    li.row.nodate { grid-template-columns:1fr auto; }
    /* the whole row opens the event; ticket links sit above the stretched title link */
    .row .title::after { content:""; position:absolute; inset:0; }
    .row a.tix, .row a.tix-link { position:relative; z-index:1; }
    .row .narrow { display:none; }
    p.see-all { margin:.4rem 0 0; font-size:.85rem; }
    .dateblock { text-align:center; line-height:1.15; padding:.3rem 0; border-radius:.5rem;
                 background:var(--pico-card-sectioning-background-color); }
    .dateblock .mon, .dateblock .dow { display:block; font-size:.65rem; text-transform:uppercase;
                 letter-spacing:.06em; color:var(--pico-muted-color); }
    .dateblock .dom { display:block; font-size:1.3rem; font-weight:700; }
    .dateblock .tba { display:block; font-size:.8rem; font-weight:600; padding:.45rem 0; }
    .row .title { font-weight:600; text-decoration:none; margin-right:.3rem; }
    .row .meta { color:var(--pico-muted-color); font-size:.85rem; }
    .row .side { display:flex; flex-direction:column; align-items:flex-end; gap:.3rem; }
    .row .price { font-size:.85rem; font-weight:600; white-space:nowrap; }
    .row a.tix { padding:.2rem .7rem; font-size:.8rem; margin:0; white-space:nowrap; }
    .tag { display:inline-block; padding:.05rem .45rem; border-radius:.6rem; font-size:.7rem;
           font-weight:600; vertical-align:middle; margin-right:.2rem; color:#fff; }
    .tag.sold-out { background:#cf222e; }
    .tag.presale { background:#9a6700; }
    .tag.soon { background:#8250df; }
    .tag.new { background:#1a7f37; }
    .tag.removed { background:#57606a; }
    .tag.chg-added { background:#1a7f37; }
    .tag.chg-tickets { background:#8250df; }
    .tag.chg-changed { background:#0969da; }
    .tag.chg-removed { background:#57606a; }
    ul.changes { padding:0; }
    ul.changes li { list-style:none; padding:.5rem 0;
                    border-bottom:1px solid var(--pico-muted-border-color); }
    ul.changes .meta { color:var(--pico-muted-color); font-size:.85rem; }
    @media (max-width: 576px) {
      /* phone: no side column -- price and tickets move into the details line */
      li.row { grid-template-columns:3rem 1fr; gap:.2rem .75rem; }
      li.row.nodate { grid-template-columns:1fr; }
      li.row.pic { grid-template-columns:6rem 1fr; }
      .row .wide { display:none; }
      .row .narrow { display:inline; }
      /* the AEM logo already links home, so the phone nav drops "Dashboard" and
         may wrap rather than push the page sideways */
      nav .nav-home, nav .nav-label { display:none; }
      nav ul:last-child { flex-wrap:wrap; justify-content:flex-end; }
      /* Pico spaces nav items through these variables */
      nav { --pico-nav-element-spacing-horizontal: .3rem;
            --pico-nav-link-spacing-horizontal: .15rem; }
    }
    @media (max-width: 385px) {
      nav { --pico-nav-element-spacing-horizontal: .2rem;
            --pico-nav-link-spacing-horizontal: .05rem; font-size:.95rem; }
    }

    /* filter bar */
    .chips { display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:.75rem; }
    .chip { position:relative; padding:.3rem .85rem; border-radius:1rem; font-size:.85rem;
            border:1px solid var(--pico-muted-border-color); cursor:pointer; margin:0; }
    .chip input { position:absolute; opacity:0; pointer-events:none; }
    .chip:has(input:checked) { background:var(--pico-primary-background);
            border-color:var(--pico-primary-background); color:var(--pico-primary-inverse); }
    .chip:has(input:focus-visible) { outline:2px solid var(--pico-primary); outline-offset:2px; }
    .filters select { margin-bottom:.5rem; }
    details.more-filters { margin-bottom:.5rem; }
    details.more-filters > summary { font-size:.9rem; }
    @media (min-width: 577px) { details.more-filters > summary { display:none; } }
    h4.group { margin:1.5rem 0 .25rem; }
    .star { color:#d4a72c; }
    /* pictures: highlight rows swap the date block for a 16:9 thumbnail */
    li.row.pic { grid-template-columns:7.5rem 1fr auto; }
    .thumb { position:relative; aspect-ratio:16/9; border-radius:.45rem; overflow:hidden;
             background:var(--pico-card-sectioning-background-color); }
    .thumb .dateblock { height:100%; display:flex; flex-direction:column; justify-content:center; }
    .thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
                 object-position:50% 25%; }
    /* promo photos keep faces in the upper part: crop from there, not the middle */
    img.hero { display:block; width:100%; max-height:22rem; aspect-ratio:16/9; object-fit:cover;
               object-position:50% 25%;
               border-radius:.6rem; margin:.25rem 0 1rem; }
    form.watch-add { margin-bottom:.75rem; }
    li.watch-entry { display:flex; justify-content:space-between; align-items:center; gap:1rem; }
    li.watch-entry form { margin:0; }
    button.small, a.small { padding:.2rem .7rem; font-size:.8rem; margin:0; width:auto; }
    .watch-buttons { display:flex; flex-wrap:wrap; gap:.4rem; margin:.5rem 0 1rem; }
    .watch-buttons form { margin:0; }
    .count { color:var(--pico-muted-color); font-size:.85rem; }
    form.htmx-request ~ #event-list { opacity:.5; transition:opacity .15s; }
  </style>
</head>
<body>
<main class="container">
  <nav>
    <ul><li><strong><a href="/" class="contrast" style="text-decoration:none">🤠 AEM</a></strong></li></ul>
    <ul>
      <li class="nav-home"><a href="/">Dashboard</a></li>
      <li><a href="/events">Events</a></li>
      <li><a href="/movies">Movies</a></li>
      <li><a href="/changes">Changes</a></li>
      <li><a href="/watchlist" aria-label="Watchlist">★<span class="nav-label"> Watchlist</span></a></li>
      <li><a href="/search">Search</a></li>
    </ul>
  </nav>
  {% block content %}{% endblock %}
  <footer class="muted">Austin Entertainment Monitor · times shown in {{ tz }}</footer>
</main>
<script>
  // wider screens show the filter dropdowns without the "Filters" toggle;
  // re-run after htmx swaps the filter block in
  function openFilters() {
    if (window.matchMedia("(min-width: 577px)").matches)
      document.querySelectorAll("details.more-filters").forEach(d => d.open = true);
  }
  openFilters();
  document.addEventListener("htmx:afterSwap", openFilters);
</script>
</body>
</html>
